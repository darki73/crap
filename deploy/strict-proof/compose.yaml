name: crap-strict-proof
services:
  proxy:
    build:
      {
        context: ../..,
        dockerfile: deploy/strict-proof/Dockerfile,
        target: proxy,
      }
    image: crap-strict-proof-proxy:local
    networks: [inside]
    tmpfs: ["/state:uid=1000,gid=1000,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  boundary:
    build:
      {
        context: ../..,
        dockerfile: deploy/strict-proof/Dockerfile,
        target: harness,
      }
    image: crap-strict-proof-harness:local
    networks: [inside, upstream]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  provider:
    image: crap-strict-proof-harness:local
    command: [node, provider.mjs]
    networks: [upstream]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  inside: { internal: true }
  upstream: { internal: true }
