# Supported single-owner deployment: strict Claude routing is mandatory.
name: crap
x-build: &build
  context: ..
  dockerfile: deploy/Dockerfile
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  bootstrap:
    build: { <<: *build, target: panel }
    image: crap-panel:alpha-local
    user: "0:0"
    entrypoint: ["node", "deploy/bootstrap.mjs"]
    environment: { CRAP_STRICT_ROUTING: "1" }
    network_mode: none
    volumes:
      - bootstrap-state:/bootstrap/seed
      - postgres-secrets:/bootstrap/postgres
      - proxy-secrets:/bootstrap/proxy
      - proxy-data:/bootstrap/proxy-data
      - control-secrets:/bootstrap/control
      - panel-secrets:/bootstrap/panel
    logging: *logging
  postgres:
    networks: [default, proxy-private]
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: crap
      POSTGRES_PASSWORD_FILE: /run/crap/password
    volumes:
      - postgres-secrets:/run/crap:ro
      - postgres-secrets:/docker-entrypoint-initdb.d:ro
      - database:/var/lib/postgresql/data
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crap"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
  migrate:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    build: { <<: *build, target: control }
    image: crap-control:alpha-local
    command: ["affinity-db"]
    volumes: ["control-secrets:/run/crap:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging
  control:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: { CRAP_STRICT_ROUTING: "1" }
    networks: [default, proxy-private]
    build: { <<: *build, target: control }
    image: crap-control:alpha-local
    volumes:
      - control-secrets:/run/crap:ro
      - control-data:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
  proxy:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: { CRAP_STRICT_URL: "http://gateway:8320", PGSTORE_SCHEMA: cliproxy, PGSTORE_LOCAL_PATH: /data, AFFINITY_SPOOL: /data/affinity-spool }
    networks: [proxy-private]
    # Official external dependency. Override CLI_PROXY_IMAGE to test an upstream update.
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:v8.0.24@sha256:302807246399682928f6dcf5a6f52032024ebffaf0e9c8bdeb05a7e235028d6f}
    user: "1000:1000"
    working_dir: /data
    entrypoint: ["sh", "/run/crap/proxy-entrypoint.sh"]
    command: ["/CLIProxyAPI/CLIProxyAPI", "--local-model"]
    hostname: crap-proxy
    volumes:
      - proxy-secrets:/run/crap:ro
      - proxy-data:/data
      - proxy-secrets:/CLIProxyAPI/plugins:ro
    depends_on:
      control: { condition: service_started }
    restart: unless-stopped
    stop_grace_period: 120s
    logging: *logging
  gateway:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [default, proxy-private]
    build: { <<: *build, target: gateway }
    image: crap-gateway:alpha-local
    environment:
      CRAP_STRICT_ROUTING: "1"
      CRAP_INTERNAL_LISTEN: 0.0.0.0:8320
      CRAP_EGRESS_LISTEN: 0.0.0.0:8321
      CRAP_OUTBOUND_URL: http://gateway:8321
      PROXY_URL: http://proxy:8317
    ports: ["127.0.0.1:${CRAP_API_PORT:-18317}:8319"]
    volumes: ["panel-secrets:/run/crap:ro"]
    depends_on:
      proxy: { condition: service_started }
    restart: unless-stopped
    stop_grace_period: 120s
    logging: *logging
  panel:
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [default, proxy-private]
    build: { <<: *build, target: panel }
    image: crap-panel:alpha-local
    ports: ["127.0.0.1:${CRAP_PANEL_PORT:-13000}:3000"]
    environment:
      CRAP_STRICT_INTERNAL_URL: http://gateway:8320
      HOST: 0.0.0.0
      PORT: "3000"
      PROXY_URL: http://proxy:8317
      INFERENCE_PROXY_URL: http://gateway:8319
      PANEL_LOCAL_API_ORIGIN: http://localhost:${CRAP_API_PORT:-18317}
      PANEL_ORIGINS: http://localhost:${CRAP_PANEL_PORT:-13000},http://127.0.0.1:${CRAP_PANEL_PORT:-13000},http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - panel-secrets:/run/crap:ro
      - panel-data:/workspace
    depends_on:
      proxy: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "deploy/health.mjs"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
volumes:
  bootstrap-state:
  postgres-secrets:
  proxy-secrets:
  control-secrets:
  panel-secrets:
  database:
  proxy-data:
  control-data:
  panel-data:

networks:
  proxy-private: { internal: true }
