name: cliproxy-panel
services:
  proxy:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:v8.0.24@sha256:302807246399682928f6dcf5a6f52032024ebffaf0e9c8bdeb05a7e235028d6f}
    command: ["./CLIProxyAPI", "--config", "/CLIProxyAPI/runtime/config.yaml", "--local-model"]
    ports:
      - "127.0.0.1:8317:8317"
      # Provider OAuth callbacks, served on demand by CLIProxyAPI.
      - "127.0.0.1:1455:1455"
      # Claude's port 54545 can be reserved by Windows; use the pasted callback.
      - "127.0.0.1:51121:51121"
    volumes:
      - ./.local-panel/runtime:/CLIProxyAPI/runtime
      - panel-auths:/root/.cli-proxy-api
      - panel-logs:/CLIProxyAPI/logs
      - panel-plugins:/CLIProxyAPI/plugins
    restart: unless-stopped
  panel:
    build: ./control-panel
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PROXY_URL: http://proxy:8317
      MANAGEMENT_KEY: ${PANEL_MANAGEMENT_KEY:?Run control-panel/scripts/init-local.mjs first}
      PANEL_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - proxy
    restart: unless-stopped
volumes:
  panel-auths:
  panel-logs:
  panel-plugins:
