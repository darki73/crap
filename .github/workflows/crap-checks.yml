name: CRAP checks
on:
  pull_request:
    paths:
      [
        "control-panel/**",
        "affinity-router/**",
        "deploy/**",
        "k8s/**",
        ".github/workflows/crap-checks.yml",
        ".github/workflows/crap-candidate.yml",
        ".github/workflows/crap-publish.yml",
        ".gitignore",
        ".dockerignore",
        "LICENSE",
        "README*.md",
        "CRAP.md",
        "doc/**",
      ]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kubernetes-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: azure/setup-helm@v4
        with: {version: "v3.19.0"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.27.2", cache: false}
      - run: python -m pip install PyYAML==6.0.3
      - run: helm lint k8s/helm/crap --strict && helm lint k8s/helm/cliproxy --strict
      - run: python k8s/check.py
      - run: node --test k8s/prepare-secrets.test.mjs
      - run: go run github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0 -strict -summary -kubernetes-version 1.30.0 k8s/manifests/ k8s/examples/private-ingress.yaml
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node doc/check-links.mjs
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node --test deploy/scan-privacy.test.mjs
      - run: node deploy/scan-privacy.mjs
      - run: node deploy/scan-secrets.mjs
      - run: node deploy/check-build-context.mjs
  strict-routing-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node deploy/strict-integration/run.mjs
      - run: node --test deploy/security-runtime.test.mjs deploy/existing-connection.test.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strict-integration-fixture-log
          path: .local-panel/strict-integration.log
  strict-routing-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: node deploy/strict-proof/run.mjs
      - if: always()
        run: docker compose -p crap-strict-proof -f deploy/strict-proof/compose.yaml down --volumes
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strict-proof-fixture-log
          path: .local-panel/strict-proof-rehearsal.log
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "24",
            cache: npm,
            cache-dependency-path: control-panel/package-lock.json,
          }
      - run: npm ci
        working-directory: control-panel
      - run: npm audit --audit-level=high
        working-directory: control-panel
      - run: npm test && npm run test:ui && npm run build
        working-directory: control-panel
      - run: node --test deploy/bootstrap.test.mjs deploy/archive.test.mjs deploy/deployment.test.mjs deploy/vulnerability-policy.test.mjs deploy/publish-ghcr.test.mjs deploy/report-scan-ownership.test.mjs
  control:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          {
            POSTGRES_USER: affinity,
            POSTGRES_PASSWORD: fixture-only,
            POSTGRES_DB: affinity_test,
          }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U affinity -d affinity_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AFFINITY_TEST_DATABASE_URL: postgres://affinity:fixture-only@localhost:5432/affinity_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          {
            go-version-file: affinity-router/go.mod,
            cache-dependency-path: affinity-router/go.sum,
          }
      - run: go test -count=1 ./...
        working-directory: affinity-router
      - run: go test -race -count=1 ./cmd/affinity-gateway ./gateway ./plugin
        working-directory: affinity-router
      - run: go test ./...
        working-directory: control-panel/tailnet-gateway
  shell:
    strategy:
      matrix: { os: [windows-latest, ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File control-panel/client-shell/test-powershell.ps1 -TestRoot "$env:RUNNER_TEMP/crap-shell"
      - if: runner.os != 'Windows'
        working-directory: control-panel
        run: bash client-shell/test-bash.sh
      - if: runner.os == 'macOS'
        working-directory: control-panel
        run: zsh client-shell/test-bash.sh
  legacy-storage-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: docker compose -p crap-ci -f deploy/compose.legacy-test.yaml build
      - run: docker compose -p crap-ci -f deploy/compose.legacy-test.yaml up -d --wait --wait-timeout 180
      - run: docker compose -p crap-ci -f deploy/compose.legacy-test.yaml exec -T -e CRAP_REHEARSAL=1 panel node deploy/smoke.mjs
      - run: node deploy/failure-rehearsal.mjs crap-ci
      - run: node deploy/recovery-rehearsal.mjs crap-ci
      - run: node deploy/backup-rehearsal.mjs crap-ci
      - run: node deploy/upgrade-rehearsal.mjs crap-ci
      - run: node deploy/external-rehearsal.mjs crap-ci
      - if: always()
        run: docker compose -p crap-ci -f deploy/compose.legacy-test.yaml down --volumes
