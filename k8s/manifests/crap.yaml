apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel
  namespace: crap
  labels: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: panel}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: panel}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: panel}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      nodeSelector: {"kubernetes.io/arch":"amd64","kubernetes.io/os":"linux"}
      tolerations: []
      imagePullSecrets: []
      containers:
        - name: panel
          image: "ghcr.io/darki73/crap-panel:REPLACE_WITH_RELEASE"
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {"limits":{"memory":"1Gi"},"requests":{"cpu":"100m","memory":"256Mi"}}
          env:
            - {name: CRAP_STRICT_ROUTING, value: "1"}
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: "3000"}
            - {name: PROXY_URL, value: "http://proxy:8317"}
            - {name: INFERENCE_PROXY_URL, value: "http://api:8319"}
            - {name: CRAP_STRICT_INTERNAL_URL, value: "http://gateway:8320"}
            - {name: PANEL_ORIGINS, value: "http://localhost:3000,http://127.0.0.1:3000"}
            - {name: PANEL_LOCAL_API_ORIGIN, value: "http://localhost:8319"}
          ports:
            - {name: http, containerPort: 3000}
          # Dependency failures remove readiness; they do not restart active streams.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - {name: Host, value: "localhost:3000"}
                - {name: X-Panel-Client, value: cliproxy-panel}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - {name: service-secret, mountPath: /run/crap, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: data, mountPath: /workspace}
      volumes:
        - name: service-secret
          secret:
            secretName: crap-panel
            defaultMode: 0440
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - name: data
          persistentVolumeClaim:
            claimName: panel-data
