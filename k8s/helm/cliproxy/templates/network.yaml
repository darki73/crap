apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxy-isolation
  namespace: {{ .Release.Namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: proxy}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/part-of: crap}
            matchExpressions: [{key: app.kubernetes.io/component, operator: In, values: [panel, gateway]}]
      ports: [{protocol: TCP, port: 8317}]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: control}}
      ports: [{protocol: TCP, port: 8318}]
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: gateway}}
      ports: [{protocol: TCP, port: 8320}, {protocol: TCP, port: 8321}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.network.databaseNamespace }}}}
          podSelector:
            matchLabels: {{ .Values.network.databasePodLabels | toJson }}
      ports: [{protocol: TCP, port: {{ .Values.network.databasePort }}}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.network.dnsNamespace }}}}
          podSelector:
            matchLabels: {{ .Values.network.dnsPodLabels | toJson }}
        {{- range .Values.network.dnsCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
