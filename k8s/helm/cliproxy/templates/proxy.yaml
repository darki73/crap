apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: {{ .Release.Namespace }}
  labels: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: proxy}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: proxy}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: proxy}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      nodeSelector: {{ .Values.nodeSelector | toJson }}
      tolerations: {{ .Values.tolerations | toJson }}
      imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
      initContainers:
        - name: install-crap-plugin
          image: {{ .Values.pluginImage | quote }}
          command: [node, -e]
          args:
            - |
              const fs = require('node:fs');
              for (const name of ['service.env', 'ca.crt', 'config.example.yaml']) {
                fs.copyFileSync('/secrets/' + name, '/adapter/' + name);
                fs.chmodSync('/adapter/' + name, 0o400);
              }
              for (const [src, name] of [
                ['/app/plugin/affinity-router.so', 'affinity-router.so'],
                ['/app/deploy/proxy-entrypoint.sh', 'proxy-entrypoint.sh'],
                ['/app/deploy/proxy-storage-guard.sh', 'proxy-storage-guard.sh']
              ]) {
                fs.copyFileSync(src, '/adapter/' + name);
                fs.chmodSync('/adapter/' + name, 0o500);
              }
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
          volumeMounts:
            - {name: adapter, mountPath: /adapter}
            - {name: service-secret, mountPath: /secrets, readOnly: true}
      containers:
        - name: proxy
          image: {{ .Values.image | quote }}
          workingDir: /data
          command: [sh, /run/crap/proxy-entrypoint.sh]
          args: [/CLIProxyAPI/CLIProxyAPI, --local-model]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ .Values.resources | toJson }}
          env:
            - {name: HOME, value: /data}
            - {name: PGSTORE_SCHEMA, value: cliproxy}
            - {name: PGSTORE_LOCAL_PATH, value: /data}
            - {name: AFFINITY_SPOOL, value: /data/affinity-spool}
            - {name: CRAP_STRICT_URL, value: "http://gateway:8320"}
          ports: [{name: http, containerPort: 8317}]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          volumeMounts:
            - {name: adapter, mountPath: /run/crap, readOnly: true}
            - {name: adapter, mountPath: /CLIProxyAPI/plugins, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: adapter, emptyDir: {medium: Memory, sizeLimit: 128Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - name: service-secret
          secret: {secretName: {{ .Values.secret }}, defaultMode: 0440}
        - name: data
          persistentVolumeClaim: {claimName: {{ default "proxy-data" .Values.persistence.existingClaim }}}
---
apiVersion: v1
kind: Service
metadata: {name: proxy, namespace: {{ .Release.Namespace }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: proxy}
  ports: [{name: http, port: 8317, targetPort: http}]
{{- if not .Values.persistence.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proxy-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.persistence.size | quote }}}
{{- end }}
