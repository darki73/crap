{{- range $item := list (dict "name" "panel" "role" "panel" "port" 3000) (dict "name" "control" "role" "control" "port" 8318) (dict "name" "api" "role" "gateway" "port" 8319) }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $item.name }}, namespace: {{ $.Release.Namespace }}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: {{ $item.role }}}
  ports: [{name: http, port: {{ $item.port }}, targetPort: http}]
{{- end }}
---
# Internal callbacks must work while public readiness is waiting for plugin readiness.
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: {{ .Release.Namespace }}}
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/part-of: crap, app.kubernetes.io/component: gateway}
  ports:
    - {name: http, port: 8319, targetPort: http}
    - {name: strict, port: 8320, targetPort: strict}
    - {name: outbound, port: 8321, targetPort: outbound}
